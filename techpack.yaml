  - id: agent-git-commit-helper
    displayName: Git Commit Helper
    description: Conventional Commits formatted commit messages
    agent:
      source: agents/git-commit-helper.md
      destination: git-commit-helper.md

  - id: agent-product-strategy-advisor
    displayName: Product Strategy Advisor
    description: Strategic product decisions about features and prioritization
    agent:
      source: agents/product-strategy-advisor.md
      destination: product-strategy-advisor.md

  - id: agent-feature-marker
    displayName: Feature Marker Agent
    description: PRD → TechSpec → Tasks → Implementation → PR workflow
    agent:
      source: agents/feature-marker.md
      destination: feature-marker.md

  - id: agent-compose-architect
    displayName: Compose Architect
    description: Jetpack Compose UI with Material 3 and modern Android patterns
    agent:
      source: agents/compose-architect.md
      destination: compose-architect.md

  - id: agent-datalayer-architect
    displayName: Data Layer Architect
    description: Kotlin Multiplatform data layer architecture
    agent:
      source: agents/datalayer-architect.md
      destination: datalayer-architect.md

  - id: agent-shadcn-requirements-analyzer
    displayName: Shadcn Requirements Analyzer
    description: Break down UI features into shadcn/ui component requirements
    agent:
      source: agents/shadcn-requirements-analyzer.md
      destination: shadcn-requirements-analyzer.md

  - id: agent-shadcn-component-researcher
    displayName: Shadcn Component Researcher
    description: Research shadcn/ui components, examples and install commands
    agent:
      source: agents/shadcn-component-researcher.md
      destination: shadcn-component-researcher.md

  - id: agent-shadcn-implementation-builder
    displayName: Shadcn Implementation Builder
