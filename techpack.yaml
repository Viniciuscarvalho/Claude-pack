    agent:
      source: agents/shadcn-implementation-builder.md
      destination: shadcn-implementation-builder.md

  - id: agent-shadcn-quick-helper
    displayName: Shadcn Quick Helper
    description: Fast shadcn/ui component installation and usage guidance
    agent:
      source: agents/shadcn-quick-helper.md
      destination: shadcn-quick-helper.md

  # ── Slash Commands ────────────────────────────────────────────────────────

  - id: cmd-commit
    displayName: /commit
    description: Create a conventional commit with staged changes
    command:
      source: commands/commit.md
      destination: commit.md

  - id: cmd-commit-fast
    displayName: /commit-fast
    description: Fast commit without interactive prompts
    command:
      source: commands/commit-fast.md
      destination: commit-fast.md

  - id: cmd-create-prd
    displayName: /create-prd
    description: Create a new PRD from requirements discussion
    command:
      source: commands/create-prd.md
      destination: create-prd.md

  - id: cmd-generate-spec
    displayName: /generate-spec
    description: Generate feature specification from a PRD
    command:
      source: commands/generate-spec.md
      destination: generate-spec.md

  - id: cmd-generate-tasks
    displayName: /generate-tasks
    description: Break down a feature spec into implementable tasks
    command:
      source: commands/generate-tasks.md
      destination: generate-tasks.md

  - id: cmd-add-to-changelog
    displayName: /add-to-changelog
    description: Update CHANGELOG.md with recent changes
    command:
      source: commands/add-to-changelog.md
      destination: add-to-changelog.md

  # ── Configuration ─────────────────────────────────────────────────────────

  - id: settings
    displayName: Claude Code Settings
    description: Permissions, model and environment variables
    isRequired: true
    settingsFile: config/settings.json

  - id: gitignore
    displayName: Gitignore entries
    description: Exclude Claude Code local files from git
    isRequired: true
    gitignore:
      - "**/.claude/settings.local.json"

# ---------------------------------------------------------------------------
# Doctor Checks
# ---------------------------------------------------------------------------
supplementaryDoctorChecks:
  - type: commandExists
    name: Homebrew
    section: Prerequisites
    command: brew
    fixCommand: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

  - type: commandExists
    name: Node.js
    section: Prerequisites
    command: node
    fixCommand: brew install node
