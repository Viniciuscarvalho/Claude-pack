  - id: agent-translation-updater
    displayName: Translation Updater
    description: Update and manage string resource translations
    agent:
      source: agents/translation_updater.md
      destination: translation_updater.md

  - id: agent-ui-designer
    displayName: UI Designer
    description: Intuitive and accessible user interfaces with design systems
    agent:
      source: agents/ui-designer.md
      destination: ui-designer.md

  - id: agent-premium-ux-designer
    displayName: Premium UX Designer
    description: Polished interfaces with animations and micro-interactions
    agent:
      source: agents/premium-ux-designer.md
      destination: premium-ux-designer.md

  - id: agent-typescript-pro
    displayName: TypeScript Pro
    description: Advanced TypeScript with full-stack development and build optimization
    agent:
      source: agents/typescript-pro.md
      destination: typescript-pro.md

  - id: agent-api-documenter
    displayName: API Documenter
    description: OpenAPI/Swagger specs, SDKs and developer documentation
    agent:
      source: agents/api-documenter.md
