  - id: agent-system-architect
    displayName: System Architect
    description: Design scalable architectures and refactor legacy systems
    agent:
      source: agents/system-architect.md
      destination: system-architect.md

  - id: agent-staff-engineer
    displayName: Staff Engineer
    description: Production-ready development with strategic system design
    agent:
      source: agents/staff-engineer.md
      destination: staff-engineer.md

  - id: agent-backend-developer
    displayName: Backend Developer
    description: Scalable API development and microservices architecture
    agent:
