# ---------------------------------------------------------------------------
# Doctor Checks — `mcs doctor` health verification
# ---------------------------------------------------------------------------
# Most components get auto-derived doctor checks — no config needed:
#   brew:       → checks if command is on PATH
#   mcp:        → checks if MCP server is registered
#   plugin:     → checks if plugin is enabled
#   hook:       → checks if hook file exists
#   skill:      → checks if skill directory exists
#   command:    → checks if command file exists
#   agent:      → checks if agent file exists
#   shell:      → NO auto-check (add doctorChecks: manually)
# 
# Add pack-level checks for prerequisites not tied to a component:
# supplementaryDoctorChecks:
#   - type: commandExists
#     name: Xcode Command Line Tools
#     section: Prerequisites
#     command: xcode-select
#     fixCommand: "xcode-select --install"
# 
# Check types: commandExists, fileExists, directoryExists, fileContains,
#   fileNotContains, shellScript, hookEventExists, settingsKeyEquals
# See: https://github.com/mcs-cli/mcs/blob/main/docs/techpack-schema.md#doctor-checks

