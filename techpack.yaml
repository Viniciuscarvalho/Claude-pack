    skill:
      source: skills/creating-pr
      destination: creating-pr

  - id: skill-jira-to-pr-workflow
    displayName: Jira to PR Workflow
    description: End-to-end workflow from Jira ticket to merged PR
    skill:
      source: skills/jira-to-pr-workflow
      destination: jira-to-pr-workflow

  - id: skill-enrich-jira-task
    displayName: Enrich Jira Task
    description: Add acceptance criteria, subtasks and test cases to Jira tickets
    skill:
      source: skills/enrich-jira-task
      destination: enrich-jira-task

  - id: skill-context-optimization
    displayName: Context Optimization
    description: Manage and optimize Claude Code context window usage
    skill:
      source: skills/context-optimization
      destination: context-optimization

  - id: skill-prompt-architect
    displayName: Prompt Architect
    description: Engineer high-quality prompts using the REASONS Canvas
    skill:
      source: skills/prompt-architect
      destination: prompt-architect

  - id: skill-grill-me
    displayName: Grill Me
    description: Stress-test plans and designs through relentless questioning
    skill:
      source: skills/grill-me
      destination: grill-me

  - id: skill-grill-with-docs
    displayName: Grill With Docs
    description: Challenge plans against domain model and update documentation
    skill:
      source: skills/grill-with-docs
      destination: grill-with-docs

  - id: skill-find-docs
    displayName: Find Docs
    description: Locate documentation across the codebase and external sources
    skill:
      source: skills/find-docs
      destination: find-docs

  - id: skill-handoff
    displayName: Handoff
    description: Create structured handoff notes between sessions
    skill:
      source: skills/handoff
      destination: handoff

  - id: skill-diagnose
    displayName: Diagnose
    description: Systematic debugging with human-in-the-loop checkpoints
    skill:
      source: skills/diagnose
      destination: diagnose

  - id: skill-skill-creator
    displayName: Skill Creator
    description: Build new Claude Code skills from scratch
    skill:
      source: skills/skill-creator
      destination: skill-creator

  - id: skill-create-skill
    displayName: Create Skill
    description: Guided workflow to create and publish a new skill
    skill:
      source: skills/create-skill
      destination: create-skill

  - id: skill-skill-orchestrator
    displayName: Skill Orchestrator
    description: Coordinate multiple skills for complex multi-step tasks
    skill:
      source: skills/skill-orchestrator
      destination: skill-orchestrator

  - id: skill-to-prd
    displayName: To PRD
    description: Turn conversation context into a published PRD
    skill:
      source: skills/to-prd
      destination: to-prd

  - id: skill-product-manager
    displayName: Product Manager
    description: Product strategy, prioritization and roadmap planning
    skill:
      source: skills/product-manager
      destination: product-manager

  - id: skill-remotion-best-practices
    displayName: Remotion Best Practices
    description: Best practices for video creation with Remotion
    skill:
      source: skills/remotion-best-practices
      destination: remotion-best-practices

  - id: skill-find-skills
    displayName: Find Skills
    description: Discover and search available Claude Code skills
    skill:
      source: skills/find-skills
      destination: find-skills

  - id: skill-skill-debugger
    displayName: Skill Debugger
    description: Debug and troubleshoot Claude Code skills
    skill:
      source: skills/skill-debugger
      destination: skill-debugger

  - id: skill-zellij-specialist
    displayName: Zellij Specialist
    description: Terminal multiplexer layout design and session management
    skill:
      source: skills/zellij-specialist
      destination: zellij-specialist

  # ── Agents ────────────────────────────────────────────────────────────────

  - id: agent-swift-expert
    displayName: Swift Expert
    description: Senior Swift developer for async/await, SwiftUI and Apple platforms
    agent:
      source: agents/swift-expert.md
