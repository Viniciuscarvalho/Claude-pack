      destination: backend-developer.md

  - id: agent-senior-code-reviewer
    displayName: Senior Code Reviewer
    description: Staff-level code review for architecture, security and production readiness
    agent:
      source: agents/senior-code-reviewer.md
      destination: senior-code-reviewer.md

  - id: agent-code-reviewer
    displayName: Code Reviewer
    description: Comprehensive code review from a senior engineering perspective
    agent:
      source: agents/code-reviewer.md
      destination: code-reviewer.md

  - id: agent-code-refactorer
    displayName: Code Refactorer
    description: Improve code quality, readability and maintainability
    agent:
      source: agents/code-refactorer.md
