schemaVersion: 1
identifier: vinicius-claude-pack
displayName: Vinicius' iOS Dev Pack
description: >
  Personal Claude Code setup for iOS/Swift development. Includes curated
  agents, skills, slash commands and plugins for Swift, SwiftUI, Xcode,
  Jira and general engineering workflows.
author: Vinicius Carvalho

ignore:
  - README.md
  - LICENSE
  - CLAUDE.md
  - skills/agents
  - templates/custom.md
  - skills/*/README.md
  - skills/*/LICENSE
  - skills/*/CHANGELOG.md
  - skills/*/CONTRIBUTING.md
  - skills/*/.DS_Store

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # ── Dependencies ─────────────────────────────────────────────────────────

  - id: node
    displayName: Node.js
    description: JavaScript runtime required by MCP servers and plugins
    brew: node

  - id: cupertino-cli
    displayName: Cupertino CLI
    description: Apple platforms MCP server
    brew: cupertino
    doctorChecks:
      - type: commandExists
        name: Cupertino CLI
        command: cupertino

  # ── MCP Servers ───────────────────────────────────────────────────────────

  - id: mcp-cupertino
    displayName: Cupertino MCP
    description: Apple documentation and APIs via MCP
    dependencies: [cupertino-cli]
    mcp:
      command: cupertino
      scope: user

  # ── Plugins ───────────────────────────────────────────────────────────────

  - id: plugin-atlassian
    displayName: Atlassian
    description: Jira and Confluence integration
    plugin: atlassian@claude-plugins-official

  - id: plugin-arscontexta
    displayName: ARS Contexta
    description: Agentic note-taking and context management
    plugin: arscontexta@agenticnotetaking

  - id: plugin-claude-hud
    displayName: Claude HUD
    description: Status line with session info
    plugin: claude-hud@claude-hud

  - id: plugin-frontend-design
    displayName: Frontend Design
    description: Frontend design assistance
    plugin: frontend-design@claude-code-plugins

  - id: plugin-swift-lsp
    displayName: Swift LSP
    description: Swift language server integration
    plugin: swift-lsp@claude-plugins-official

  # ── Skills — Swift & iOS ──────────────────────────────────────────────────

  - id: skill-swift-best-practices
    displayName: Swift Best Practices
    description: Swift idioms, patterns and modern API usage
    skill:
      source: skills/swift-best-practices
      destination: swift-best-practices

  - id: skill-swift-concurrency
    displayName: Swift Concurrency
    description: async/await, actors, Swift 6 migration guidance
    skill:
      source: skills/swift-concurrency
      destination: swift-concurrency

  - id: skill-swift-testing
    displayName: Swift Testing
    description: Swift Testing framework patterns and best practices
    skill:
      source: skills/swift-testing
      destination: swift-testing

  - id: skill-swift-testing-expert
    displayName: Swift Testing Expert
    description: Advanced Swift Testing with parameterized tests and async
    skill:
      source: skills/swift-testing-expert
      destination: swift-testing-expert

  - id: skill-swift-code-reviewer
    displayName: Swift Code Reviewer
    description: Multi-layer code review for Swift and SwiftUI projects
    skill:
      source: skills/swift-code-reviewer
      destination: swift-code-reviewer

  - id: skill-swift-code-reviewer-skill
    displayName: Swift Code Reviewer (Skill)
    description: Structured Swift/SwiftUI review across six dimensions
    skill:
      source: skills/swift-code-reviewer-skill
      destination: swift-code-reviewer-skill

  - id: skill-swiftui-expert
    displayName: SwiftUI Expert
    description: SwiftUI state management, performance and modern APIs
    skill:
      source: skills/swiftui-expert-skill
      destination: swiftui-expert-skill

  - id: skill-swiftui-ui-patterns
    displayName: SwiftUI UI Patterns
    description: Navigation, sheets, lists, tabs and layout patterns
    skill:
      source: skills/swiftui-ui-patterns
      destination: swiftui-ui-patterns

  - id: skill-swiftui-view-refactor
    displayName: SwiftUI View Refactor
    description: Refactor views for consistent structure and Observation usage
    skill:
      source: skills/swiftui-view-refactor
      destination: swiftui-view-refactor

  - id: skill-swiftui-performance-audit
    displayName: SwiftUI Performance Audit
    description: Identify and fix excessive view updates and layout issues
    skill:
      source: skills/swiftui-performance-audit
      destination: swiftui-performance-audit

  - id: skill-xcodebuildmcp-cli
    displayName: XcodeBuildMCP CLI
    description: Build, test and run Xcode projects via MCP tools
    skill:
      source: skills/xcodebuildmcp-cli
      destination: xcodebuildmcp-cli

  - id: skill-xcode-build-fixer
    displayName: Xcode Build Fixer
    description: Diagnose and fix Xcode build errors
    skill:
      source: skills/xcode-build-fixer
      destination: xcode-build-fixer

  - id: skill-xcode-build-orchestrator
    displayName: Xcode Build Orchestrator
    description: Orchestrate build, analysis and optimization workflows
    skill:
      source: skills/xcode-build-orchestrator
      destination: xcode-build-orchestrator

  - id: skill-xcode-build-benchmark
    displayName: Xcode Build Benchmark
    description: Measure and compare Xcode build times
    skill:
      source: skills/xcode-build-benchmark
      destination: xcode-build-benchmark

  - id: skill-xcode-compilation-analyzer
    displayName: Xcode Compilation Analyzer
    description: Identify slow-compiling files and functions
    skill:
      source: skills/xcode-compilation-analyzer
      destination: xcode-compilation-analyzer

  - id: skill-xcode-project-analyzer
    displayName: Xcode Project Analyzer
    description: Audit project settings and build configuration
    skill:
      source: skills/xcode-project-analyzer
      destination: xcode-project-analyzer

  - id: skill-spm-build-analysis
    displayName: SPM Build Analysis
    description: Analyze Swift Package Manager build performance
    skill:
      source: skills/spm-build-analysis
      destination: spm-build-analysis

  - id: skill-ios-debugger-agent
    displayName: iOS Debugger Agent
    description: Debug iOS apps with LLDB and crash log analysis
    skill:
      source: skills/ios-debugger-agent
      destination: ios-debugger-agent

  - id: skill-kotlin-specialist
    displayName: Kotlin Specialist
    description: Kotlin coroutines, KMP and Compose guidance
    skill:
      source: skills/kotlin-specialist
      destination: kotlin-specialist

  - id: skill-app-store-changelog
    displayName: App Store Changelog
    description: Generate App Store release notes from commits
    skill:
      source: skills/app-store-changelog
      destination: app-store-changelog

  # ── Skills — Engineering Workflow ─────────────────────────────────────────

  - id: skill-tdd
    displayName: TDD
    description: Test-driven development with Red-Green-Refactor cycle
    skill:
      source: skills/tdd
      destination: tdd

  - id: skill-code-analyzer
    displayName: Code Analyzer
    description: Architecture review and code quality assessment
    skill:
      source: skills/code-analyzer
